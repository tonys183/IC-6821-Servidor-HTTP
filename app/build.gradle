plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'checkstyle'
    id 'jacoco'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'edu.byohttp.ByoHttp'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

jacoco {
    toolVersion = "0.8.12"  // versión estable (2025)
}

jacocoTestReport {
    dependsOn test // el reporte se genera después de ejecutar las pruebas
    reports {
        xml.required = true
        csv.required = false
        html.required = true // genera reporte navegable en HTML
    }
}

tasks.test {
    testLogging {
        events("PASSED", "FAILED", "SKIPPED") // Muestra cada prueba
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
        showStandardStreams = true // Muestra System.out y System.err
    }
}
